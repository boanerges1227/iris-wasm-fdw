name: Build and lint

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Require release tag to match package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          package_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          test "$GITHUB_REF_NAME" = "v$package_version"
      - name: Install pinned Rust and component tool
        run: bash scripts/setup-rust.sh
      - name: Build and lint public sources
        run: bash scripts/check.sh
      - name: Upload built Wasm
        uses: actions/upload-artifact@v4
        with:
          name: iris-fdw-wasm
          path: target/wasm32-unknown-unknown/release/iris_fdw.wasm
          if-no-files-found: error
